<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Apex Build</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/Icons/favicon.png">
  <link rel="apple-touch-icon" href="/Icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#FF5A1F">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f4f1ea; --ink:#14161a; --muted:#5c5f66; --orange:#ff5a1f; --ease:cubic-bezier(.2,.7,.2,1);
      --grid: linear-gradient(rgba(20,22,26,.055) 1px, transparent 1px) 0 0 / 32px 32px, linear-gradient(90deg, rgba(20,22,26,.055) 1px, transparent 1px) 0 0 / 32px 32px; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--grid), var(--bg); color:var(--ink); display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
    .tape { height:34px; background:repeating-linear-gradient(-45deg, #ffc21a 0 22px, var(--ink) 22px 44px); border-block:2px solid var(--ink); }
    .tape span { display:block; }
    main { flex:1; display:grid; place-items:center; padding:40px 16px; text-align:center; }
    .code { font-family:'JetBrains Mono',monospace; color:var(--orange); letter-spacing:.1em; font-size:.85rem; margin-bottom:14px; }
    .code::before { content:"// "; color:var(--muted); }
    h1 { font-family:'Archivo',sans-serif; font-stretch:125%; font-variation-settings:"wdth" 125; font-weight:800; font-size:clamp(2rem,7vw,3.4rem); line-height:1.02; letter-spacing:-.02em; margin-bottom:14px; }
    p { color:var(--muted); font-size:1.08rem; max-width:440px; margin:0 auto 28px; }
    .hat-drop { position:relative; width:120px; margin:0 auto 18px; animation:drop .9s var(--ease) both; }
    .hat-fly { display:block; }
    .hat-fly.gone { animation:fly 1.1s cubic-bezier(.5,0,.8,.4) forwards; }
    .hat-fly.back { animation:drop .9s var(--ease) both; }
    .hat { display:block; width:120px; height:auto; cursor:pointer; transform-origin:50% 90%; -webkit-tap-highlight-color:transparent; }
    .hat.wobble { animation:wobble .6s ease; }
    .santa { display:none; position:absolute; width:62px; left:44px; top:-34px; transform:rotate(16deg); pointer-events:none; }
    html.christmas .santa { display:block; }
    main { -webkit-user-select:none; user-select:none; }
    main p, main h1 { -webkit-user-select:text; user-select:text; }
    .gust { -webkit-user-select:none !important; user-select:none !important; }
    .gust { height:20px; margin:-10px 0 8px; font-family:'JetBrains Mono',monospace; font-size:.8rem; color:var(--muted); opacity:0; transition:opacity .3s; }
    .gust.on { opacity:1; }
    @keyframes fly { 0% { transform:none; } 25% { transform:translate(-10px,8px) rotate(-10deg); } 100% { transform:translate(70vw,-80vh) rotate(540deg); opacity:.6; } }
    @keyframes drop { 0% { transform:translateY(-60px) rotate(-12deg); opacity:0; } 60% { transform:translateY(6px) rotate(4deg); opacity:1; } 100% { transform:none; } }
    @keyframes wobble { 25% { transform:rotate(-8deg); } 50% { transform:rotate(6deg); } 75% { transform:rotate(-3deg); } }
    .btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .btn { display:inline-flex; align-items:center; padding:14px 22px; border-radius:8px; font-weight:700; text-decoration:none; border:2px solid var(--ink); color:var(--ink); transition:transform .15s var(--ease), box-shadow .15s var(--ease); }
    .btn-primary { background:var(--orange); box-shadow:4px 4px 0 var(--ink); }
    .btn-primary:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
    .btn-ghost:hover { background:var(--ink); color:var(--bg); }
    @media (prefers-reduced-motion: reduce) { .hat-drop, .hat, .hat-fly { animation:none !important; } }
  </style>
</head>
<body>
  <div class="tape" aria-hidden="true"></div>
  <main>
    <div>
      <div class="hat-drop"><div class="hat-fly" id="hatFly">
      <svg class="hat" id="hat" viewBox="0 0 120 80" aria-hidden="true">
        <path d="M14 62 Q14 22 60 18 Q106 22 106 62 Z" fill="#ff5a1f" stroke="#14161a" stroke-width="4" stroke-linejoin="round"/>
        <path d="M52 19 Q60 14 68 19 L66 60 L54 60 Z" fill="#ff7a45" stroke="#14161a" stroke-width="3" stroke-linejoin="round"/>
        <rect x="4" y="60" width="112" height="12" rx="6" fill="#ff5a1f" stroke="#14161a" stroke-width="4"/>
      </svg>
      <svg class="santa" viewBox="0 0 46 37" style="overflow:visible" aria-hidden="true"><path d="M5 27 C8 13 18 4 31 6 C38 7 41 13 39 21 C36 16 33 15 30 16 C30 20 32 23 34 27 Z" fill="#e0312b" stroke="#14161a" stroke-width="2.2" stroke-linejoin="round"/><rect x="2" y="24" width="35" height="9" rx="4.5" fill="#fff" stroke="#14161a" stroke-width="2.2"/><circle cx="39" cy="22" r="4.6" fill="#fff" stroke="#14161a" stroke-width="2.2"/></svg>
      </div></div>
      <div class="gust" id="gust" aria-live="polite"></div>
      <div class="code">ERROR 404</div>
      <h1>This page is still under construction.</h1>
      <p>Or it never existed. Either way, there's nothing to see here yet. Let's get you back on solid ground.</p>
      <div class="btns">
        <a class="btn btn-primary" href="/">Back to the homepage</a>
        <a class="btn btn-ghost" href="/#contact">Get a free mockup</a>
      </div>
    </div>
  </main>
  <div class="tape" aria-hidden="true"></div>
  <script>
    // Seasonal: Santa hat Dec 1 to 26 (preview with ?preview=christmas)
    (function () {
      const o = {}; new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Edmonton', month: 'numeric', day: 'numeric' }).formatToParts(new Date()).forEach(p => o[p.type] = +p.value);
      if (new URLSearchParams(location.search).get('preview') === 'christmas' || (o.month === 12 && o.day <= 26)) document.documentElement.classList.add('christmas');
    })();
    // The hat wobbles once when you hover or tap it. Tap it 3 times and it blows away.
    (function () {
      const hat = document.getElementById('hat'), fly = document.getElementById('hatFly'), gust = document.getElementById('gust');
      let clicks = [], busy = false;
      const wobble = () => { if (busy || hat.classList.contains('wobble')) return; hat.classList.add('wobble'); };
      hat.addEventListener('animationend', () => hat.classList.remove('wobble'));
      hat.addEventListener('mouseenter', wobble);
      hat.addEventListener('click', () => {
        if (busy) return;
        const now = Date.now(); clicks = clicks.filter(t => now - t < 1500); clicks.push(now);
        if (clicks.length < 3) { hat.classList.remove('wobble'); void hat.offsetWidth; hat.classList.add('wobble'); return; }
        clicks = []; busy = true; hat.classList.remove('wobble');
        fly.classList.add('gone'); gust.textContent = 'Hold on to your hat.'; gust.classList.add('on');
        setTimeout(() => { fly.classList.remove('gone'); fly.classList.add('back'); gust.classList.remove('on'); }, 2400);
        setTimeout(() => { fly.classList.remove('back'); busy = false; }, 3400);
      });
    })();
  </script>
</body>
</html>
